apiVersion: apps/v1
kind: Deployment
metadata:
  name: rootline-app
  labels:
    app: rootline
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  selector:
    matchLabels:
      app: rootline
  template:
    metadata:
      labels:
        app: rootline
    spec:
      containers:
        - name: rootline
          image: rootline:latest
          ports:
            - containerPort: 8000
          env:
            - name: FALKORDB_HOST
              value: "falkordb-service"
            - name: FALKORDB_PORT
              value: "6379"
            - name: ROOTLINE_GRAPH
              value: "rootline"
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: rootline-service
spec:
  type: ClusterIP
  selector:
    app: rootline
  ports:
    - port: 80
      targetPort: 8000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: rootline-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: rootline-app
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
